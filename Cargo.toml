[package]
name = "soilmachine"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for SoilMachine geomorphology simulator"

[lib]
name = "soilmachine"
crate-type = ["rlib"]

[build-dependencies]
cc = "1.0"
glob = "0.3"

[dev-dependencies]
proptest = "1.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
