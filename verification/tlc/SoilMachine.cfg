(* ===================================================================
   SoilMachine TLC Configuration
   ===================================================================
   
   This configuration file controls the TLC model checker.
   Key parameters:
   - MaxMem: memory limit for state space (in MB)
   - Depth: maximum depth to explore (smaller = faster, less complete)
   - workers: parallel workers for state space exploration
   
   Run: java tlc2.TLC -workers 4 -deadlock SoilMachine
   *)

MODULE SoilMachine

(* Memory: 4GB max for large model checking *)
MaxMem = 4096

(* Depth: explore 100 steps (smaller for quick checks) *)
Depth = 100

(* Use 4 parallel workers *)
workers = 4

(* Check for deadlocks *)
checkDeadlocks = TRUE

(* Constant values for model checking *)
constants = 
    GridSize = 8,
    MaxWaterParticles = 10,
    MaxWindParticles = 10,
    MaxSteps = 50,
    MaxHeight = 100
